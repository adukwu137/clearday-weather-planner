# Installed on web-01 and web-02 as /etc/nginx/sites-available/clearday.
# Nginx listens on port 80 (the port the load balancer and firewall expect)
# and hands requests to the Node app, which only listens on localhost:3000.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Trust X-Forwarded-For only from the load balancer, so rate limiting sees
    # the real visitor. If the load balancer reaches this server from another
    # address, use the one in /var/log/nginx/access.log instead.
    set_real_ip_from 3.10.24.245;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
